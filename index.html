<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibe Clock</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --text: #e0e0e0;
      --accent: #00d4ff;
      --button: #333;
      --hover: #444;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: var(--surface);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      text-align: center;
      width: 320px;
    }
    #clock {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--accent);
      letter-spacing: 1px;
    }
    .buttons {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    button {
      flex: 1;
      background: var(--button);
      color: var(--text);
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: var(--hover);
    }
    button:active {
      transform: scale(0.98);
    }
    #addBtn { background: var(--accent); color: #000; font-weight: 600; }
    #addBtn:hover { background: #00e6ff; }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
    }
    li {
      padding: 0.6rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 0.9rem;
    }
    li:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="container">
    <div id="clock">00:00:00</div>
    <div class="buttons">
      <button id="addBtn">Add Time</button>
      <button id="clearBtn">Clear</button>
    </div>
    <ul id="list"></ul>
  </div>
  <script>
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('clock').textContent = time;
    }
    setInterval(updateClock, 1000);
    updateClock();

    const list = document.getElementById('list');
    document.getElementById('addBtn').addEventListener('click', () => {
      const li = document.createElement('li');
      li.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      list.appendChild(li);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      list.innerHTML = '';
    });
  </script>
</body>
</html>
